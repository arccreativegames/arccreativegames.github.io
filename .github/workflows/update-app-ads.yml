name: Update CAS app-ads.txt

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-app-ads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest CAS app-ads.txt
        run: |
          curl -L \
          https://raw.githubusercontent.com/cleveradssolutions/App-ads.txt/main/app-ads.txt \
          -o cas-app-ads.txt

      - name: Build final app-ads.txt
        run: |
          cat cas-app-ads.txt > app-ads.txt

          echo "" >> app-ads.txt
          echo "# DARC Creative Games - Custom Entries" >> app-ads.txt

          cat custom-app-ads.txt >> app-ads.txt

      - name: Remove temporary CAS file
        run: |
          rm cas-app-ads.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app-ads.txt

          if git diff --cached --quiet; then
            echo "No changes found."
          else
            git commit -m "Update app-ads.txt from CAS.ai"
            git push
          fi
